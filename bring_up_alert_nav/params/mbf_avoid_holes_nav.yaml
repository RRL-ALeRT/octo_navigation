move_base_flex:
  ros__parameters:
    global_frame: 'map'
    robot_frame: 'base_link'
    odom_topic: '/odometry'
    octomap_topic: '/octomap_binary'

    use_sim_time: false
    force_stop_at_goal: true
    force_stop_on_cancel: true

    octo_mapping_server:
      min_floor_support_ratio: 0.0

    # All planners are loaded at startup; GetPath goals pick one by name
    # (rviz alert panel dropdown). Empty planner name = first in this list.
    planners: ['AvoidHolesPlanner', 'AstarPlanner', 'Astar2dPlanner', 'FrontierPlanner']
    # 3D A* on the avoid-holes octomap graph.
    AvoidHolesPlanner:
      type: 'astar_planner/AstarAvoidHolesOctoPlanner'
      cost_limit: 0.8
      publish_vector_field: true
      robot_radius: 0.0
      robot_height: 0.7
    # General 3D A* on the octomap graph, no hole avoidance.
    AstarPlanner:
      type: 'astar_octo_planner/AstarOctoPlanner'
      cost_limit: 0.8
      publish_vector_field: true
      robot_radius: 0.0
      robot_height: 0.7
    # 2D costmap A*; needs the projected map from octomap_server (/projected_map_1m).
    Astar2dPlanner:
      type: 'astar_2d_planner/Astar2dPlanner'
      cost_limit: 0.95
      publish_vector_field: true
      obstacle_inflation_radius: 0.6
      inflation_decay_rate: 0.5
    # Exploration on the avoid-holes graph: ignores the goal, picks a frontier
    # and plans to it. Used by exe_path_node's exploration loop.
    FrontierPlanner:
      type: 'astar_planner/AvoidHolesExplorationPlanner'
    planner_patience: 10.0
    planner_max_retries: 2

    controllers: ['octo_controller']
    octo_controller:
      type: 'octo_controller/OctoController'
      ang_vel_factor: 0.3
      lin_vel_factor: 0.5
      max_lin_velocity: 0.75
      max_ang_velocity: 0.5

    controller_patience: 2.0
    controller_max_retries: 4
    dist_tolerance: 0.3
    angle_tolerance: 0.3
    cmd_vel_ignored_tolerance: 15.0
    controller_frequency: 50.0
